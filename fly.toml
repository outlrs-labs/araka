# Fly.io config for FollowUp Bot.
#   fly launch --no-deploy      (creates the app; you can accept/replace this file)
#   fly volumes create followup_data --size 1 --region bom
#   fly secrets set WA_ACCESS_TOKEN=... GROQ_API_KEY=... (see setup/DEPLOY.md)
#   fly deploy
app = "followup-bot"            # change to your unique app name
primary_region = "bom"          # Mumbai — closest to India users

[build]

[env]
  DATABASE_URL = "sqlite+aiosqlite:////data/notebot.db"
  REQUIRE_WA_SIGNATURE = "true"
  WA_API_VERSION = "v21.0"
  BOT_TIMEZONE = "Asia/Kolkata"
  # BASE_URL is set after first deploy:  fly secrets set BASE_URL=https://<app>.fly.dev

# Persistent disk for SQLite — survives restarts & redeploys.
[mounts]
  source = "followup_data"
  destination = "/data"

[http_service]
  internal_port = 5000
  force_https = true
  # CRITICAL: never sleep — the reminder scheduler must keep running.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
