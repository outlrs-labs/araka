<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Connection failed — FollowUp Bot</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         background:linear-gradient(160deg,#fdecea,#f7faf9); color:#1f2d3d; }
  .card { background:#fff; border-radius:20px; padding:44px 36px; max-width:440px; text-align:center;
          box-shadow:0 12px 40px rgba(176,0,32,.10); margin:20px; }
  .x { width:76px; height:76px; border-radius:50%; background:#e74c3c; color:#fff; font-size:40px;
       display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
  h1 { margin:0 0 8px; font-size:24px; }
  p { color:#6b7c93; margin:6px 0; }
  .err { background:#fbeae8; color:#a02; border-radius:8px; padding:10px 12px; font-size:13px;
         margin:16px 0; word-break:break-word; }
  .hint { margin-top:18px; font-size:14px; color:#075E54; font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <div class="x">!</div>
    <h1>Couldn’t connect</h1>
    <p>The authorization link may have expired or was cancelled.</p>
    <div class="err">{{ERROR}}</div>
    <p class="hint">Go back to WhatsApp and tap “🔗 Connect Google” again.</p>
  </div>
</body>
</html>
