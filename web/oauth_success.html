<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Connected — FollowUp Bot</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         background:linear-gradient(160deg,#e8f5f0,#f7faf9); color:#1f2d3d; }
  .card { background:#fff; border-radius:20px; padding:44px 36px; max-width:420px; text-align:center;
          box-shadow:0 12px 40px rgba(7,94,84,.12); margin:20px; }
  .check { width:76px; height:76px; border-radius:50%; background:#25D366; color:#fff; font-size:42px;
           display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
  h1 { margin:0 0 8px; font-size:26px; }
  p { color:#6b7c93; margin:6px 0; }
  .hint { margin-top:22px; font-size:14px; color:#075E54; font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Google connected!</h1>
    <p>📅 Calendar · 📇 Contacts · 🖥 Meet are now linked to FollowUp Bot.</p>
    <p class="hint">You can close this tab and head back to WhatsApp.</p>
  </div>
</body>
</html>
